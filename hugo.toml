baseURL = "https://capitalliterario.com.br/"
languageCode = "pt-br"
title = "O Capital Literário"
paginate = 16

[params]
  descricao = "A trama minimalista e humana de um mundo gerado por IA."
  edicao = "Ano I — Nº 1"
  instagram = "https://www.instagram.com/ocapitalliterario/"
  substack = "https://ocapitalliterario.substack.com/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Configuração para gerar o llms.txt
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML", "llms"]

[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats.llms]
  mediaType = "text/plain"
  isPlainText = true
  baseName = "llms"
  notAlternative = true